[project]
name = "job-tracker"
version = "0.1.0"
description = "AI-powered job application tracker with LLM parsing, skill matching, and CV tailoring"
readme = "README.md"
authors = [
    { name = "Panagiotis-Andriano", email = "panagiotis.andrianopoulos23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "langchain-groq>=1.1.2",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.55.0",
    "uvicorn>=0.42.0",
]

[project.scripts]
job-tracker = "job_tracker:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
